name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        config:
          - {
            os: macos-latest,
            c: "clang",
            cmake_opts: "-DWANT_PLAYER=ON -DWANT_STATIC=ON -DWANT_COREAUDIO=ON"
          }
          - {
            os: ubuntu-latest,
            c: "clang",
            cmake_opts: "-DWANT_PLAYER=ON -DWANT_STATIC=ON -DWANT_OPENAL=ON -DWANT_ALSA=ON -DWANT_OSS=ON"
          }
          - {
            os: ubuntu-latest,
            c: "gcc",
            cmake_opts: "-DWANT_PLAYER=ON -DWANT_STATIC=ON -DWANT_OPENAL=ON -DWANT_ALSA=ON -DWANT_OSS=ON"
          }
          - {
            os: windows-latest,
            c: "cl",
            cmake_opts: "-DWANT_PLAYER=ON -DWANT_STATIC=ON -DWANT_WINMM=ON"
          }
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libopenal-dev
      - name: Build with ${{ matrix.config.os }} / ${{ matrix.config.c }}
        env:
          CC: ${{ matrix.config.c }}
        run: |
          cmake -B build ${{ matrix.config.cmake_opts }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=build/out
          cmake --build build -j2 --config Release
          ctest --test-dir build --output-on-failure -C Release
          cmake --install build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wildmidi-${{ matrix.config.os }}-${{ matrix.config.c }}
          path: build/out/
          retention-days: 14

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test with ASan + UBSan
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DWANT_PLAYER=OFF \
            -DCMAKE_C_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
